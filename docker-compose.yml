services:
  # ========================================
  # PostgreSQL Database Container
  # ========================================
  db:
    image: postgres:16-alpine
    container_name: simple-crm-lite-db
    environment:
      POSTGRES_DB: simplecrmlite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simplecrmlite"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Spring Boot Application Container
  # ========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simple-crm-lite-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/simplecrmlite
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ========================================
  # React Frontend Container (Vite + Nginx)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simple-crm-lite-frontend
    ports:
      - "3000:80"
    depends_on:
      - app
    restart: unless-stopped

# ========================================
# Volumes (Persistent Storage)
# ========================================
volumes:
  postgres-data: